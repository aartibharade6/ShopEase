
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search live weather conditions by city.">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="weather-container">
        <h1>🌦️ Weather Dashboard</h1>
        <p>Check the current weather in your city.</p>

        <form id="weather-form">
            <label for="city-input">Enter City Name</label>
            <div class="search-row">
                <input type="text" id="city-input"
                       placeholder="Example: Mumbai" required>
                <button type="submit">Search</button>
            </div>
        </form>

        <p id="status" role="status" aria-live="polite"></p>

        <section id="weather-result" aria-labelledby="city-name" hidden>
            <h2 id="city-name"></h2>
            <p id="weather-description"></p>

            <div class="weather-grid">
                <article class="weather-card">
                    <h3>Temperature</h3>
                    <p id="temperature">--</p>
                </article>

                <article class="weather-card">
                    <h3>Humidity</h3>
                    <p id="humidity">--</p>
                </article>

                <article class="weather-card">
                    <h3>Wind Speed</h3>
                    <p id="wind-speed">--</p>
                </article>
            </div>

            <p id="updated-time"></p>
        </section>

        <footer>
            <p>Weather data: Open-Meteo</p>
        </footer>
    </main>
</body>
</html>
